[package]
name = "pipe-graph"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.18.0", optional = true }
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml = "0.9.34"
toml = "1.1.6"

[features]
# Default to headless core runtime.
default = []

# Enables Bevy ECS + systems (editor/runtime integration experiments).
bevy = ["dep:bevy"]
