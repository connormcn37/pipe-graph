[package]
name = "pipe-graph"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.18.0", optional = true }

[dev-dependencies]
# Only for tests that inspect the bundled editor font's glyph coverage and
# advance widths. Pinned to the version Bevy's text stack already pulls in, so
# it adds nothing new to the dependency tree.
ttf-parser = "=0.25.1"

[features]
# Default to headless core runtime.
default = []

# Enables Bevy ECS + systems (editor/runtime integration experiments).
bevy = ["dep:bevy"]

# Interactive node editor; needs a display:
#   cargo run --features bevy --example editor
[[example]]
name = "editor"
required-features = ["bevy"]
