[package]
name = "pipe-graph"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.18.0", optional = true }
# Pinned to the wgpu Bevy uses, so the editor and the runtime can share a device.
wgpu = { version = "27", optional = true }
pollster = { version = "0.4", optional = true }

[features]
# Default to headless core runtime.
default = []

# Enables Bevy ECS + systems (editor/runtime integration experiments).
bevy = ["dep:bevy"]

# Frames on the GPU: wgpu context, GPU frame storage, transfers, and
# `Node::eval_gpu`. Tests need a Vulkan/Metal/DX12 adapter (lavapipe works).
gpu = ["dep:wgpu", "dep:pollster"]

# Interactive node editor; needs a display:
#   cargo run --features bevy --example editor
[[example]]
name = "editor"
required-features = ["bevy"]
