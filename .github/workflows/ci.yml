name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: headless
            features: "--no-default-features"
          - name: bevy
            features: "--features bevy"
          # GPU code on lavapipe (Mesa's software Vulkan): checks correctness,
          # not speed. GPU tests skip without an adapter unless
          # PIPE_GRAPH_REQUIRE_GPU is set, as it is here.
          - name: gpu
            features: "--features gpu"
    steps:
      - uses: actions/checkout@v4

      # Bevy needs these system libraries to build on Linux (windowing, audio,
      # input). Only the `bevy` feature leg pulls them in.
      - name: Install Bevy system dependencies
        if: matrix.name == 'bevy'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libx11-dev

      - name: Install lavapipe (software Vulkan)
        if: matrix.name == 'gpu'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers
          echo "PIPE_GRAPH_REQUIRE_GPU=1" >> "$GITHUB_ENV"

      # Installs the toolchain pinned in rust-toolchain.toml (incl. rustfmt + clippy).
      - name: Install Rust
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets ${{ matrix.features }} -- -D warnings

      - name: Test
        run: cargo test ${{ matrix.features }}

      # Docs must build warning-free, both the public API and the private-item
      # docs (much of the design reasoning lives on private items).
      - name: Docs
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: |
          cargo doc --no-deps ${{ matrix.features }}
          cargo doc --no-deps --document-private-items ${{ matrix.features }}

      # The cargo-fuzz crate (fuzz/) is outside the workspace, so the steps
      # above never build it. Fuzzing itself needs nightly, but the targets
      # compile on stable, so lint them here to catch API drift.
      - name: Fuzz targets compile
        if: matrix.name == 'headless'
        run: |
          cargo fmt --manifest-path fuzz/Cargo.toml --all --check
          cargo clippy --manifest-path fuzz/Cargo.toml --all-targets -- -D warnings
